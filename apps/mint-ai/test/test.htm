<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>vAgent Chat Demo — Dual</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        background: #fefefe;
        font:
          14px system-ui,
          sans-serif;
        margin: 20px;
      }
      h2 {
        margin-top: 0;
      }
      .container {
        display: flex;
        gap: 20px;
      }
      .panel {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        height: 90vh;
      }
      .log {
        border: 1px solid #ccc;
        padding: 8px;
        flex: 1;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      .msg {
        margin: 6px 0;
      }
      .user {
        color: #333;
      }
      .ai {
        color: #0a7;
      }
      .sys {
        color: #888;
      }
      .typing {
        font-style: italic;
        color: #555;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
        100% {
          opacity: 1;
        }
      }
      form {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      input,
      button {
        font: inherit;
      }
      input {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <h2>vAgent Chat Demo — Dual Panel</h2>
    <div class="container">
      <!-- Onboarding Panel -->
      <div class="panel" id="onboarding">
        <h3>Business Onboarding</h3>
        <div>
          <label
            >Session:
            <input id="sid-onboard" value="onboard-session-1" />
          </label>
          <label>Run ID: <input id="rid-onboard" placeholder="auto" /></label>
        </div>
        <div class="log" id="log-onboard"></div>
        <form id="form-onboard">
          <input id="text-onboard" placeholder="Tell me about your business…" />
          <button>Send</button>
        </form>
      </div>

      <!-- Normal Chat Panel -->
      <div class="panel" id="normal">
        <h3>Normal Chat</h3>
        <div>
          <label
            >Session:
            <input id="sid-normal" value="normal-session-1" />
          </label>
          <label>Run ID: <input id="rid-normal" placeholder="auto" /></label>
        </div>
        <div class="log" id="log-normal"></div>
        <form id="form-normal">
          <input id="text-normal" placeholder="Say hello…" />
          <button>Send</button>
        </form>
      </div>
    </div>

    <script type="module">
      const API_BASE = "http://localhost:3000";

      function uuid() {
        if (window.crypto?.randomUUID) return crypto.randomUUID();
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
          const r = (Math.random() * 16) | 0,
            v = c === "x" ? r : (r & 0x3) | 0x8;
          return v.toString(16);
        });
      }

      function initChat({ formId, textId, logId, sidId, ridId, workflowId }) {
        const form = document.getElementById(formId);
        const input = document.getElementById(textId);
        const logEl = document.getElementById(logId);
        const sid = document.getElementById(sidId);
        const rid = document.getElementById(ridId);

        function line(cls, text, id) {
          const div = document.createElement("div");
          div.className = "msg " + cls;
          div.textContent = text;
          if (id) div.id = id;
          logEl.appendChild(div);
          logEl.scrollTop = logEl.scrollHeight;
          return div;
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const message = input.value.trim();
          if (!message) return;
          line("user", "You: " + message);
          input.value = "";

          const runId = (rid.value || "").trim() || uuid();
          rid.value = runId;

          const typingId = "typing-" + runId;
          line("typing", "AI is typing…", typingId);

          try {
            const res = await fetch(`${API_BASE}/v1/runs/${workflowId}`, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                accept: "application/json",
              },
              body: JSON.stringify({
                runId,
                sessionId: sid.value,
                input: { message },
              }),
            });
            if (!res.ok) {
              const text = await res.text().catch(() => "");
              throw new Error(`Request failed: ${res.status} ${text}`);
            }
            const data = await res.json();
            document.getElementById(typingId)?.remove();
            line("ai", "AI: " + data.reply);
          } catch (err) {
            document.getElementById(typingId)?.remove();
            line("sys", "⚠️ " + (err?.message || err));
          }
        });
      }

      // Left panel: Business Onboarding Workflow
      initChat({
        formId: "form-onboard",
        textId: "text-onboard",
        logId: "log-onboard",
        sidId: "sid-onboard",
        ridId: "rid-onboard",
        workflowId: "onboarding",
      });

      // Right panel: Normal Chat Workflow
      initChat({
        formId: "form-normal",
        textId: "text-normal",
        logId: "log-normal",
        sidId: "sid-normal",
        ridId: "rid-normal",
        workflowId: "chat",
      });
    </script>
  </body>
</html>
