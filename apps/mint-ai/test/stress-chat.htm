<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>vAgent Multi-Chat Tester</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        background: #f7f9fb;
        font:
          14px system-ui,
          sans-serif;
        margin: 20px;
        color: #222;
      }
      h2 {
        margin-top: 0;
        font-size: 22px;
        color: #333;
      }
      .controls {
        margin-bottom: 14px;
      }
      .container {
        display: flex;
        gap: 16px;
        overflow-x: auto;
      }
      .panel {
        flex: 1 1 25%;
        min-width: 300px;
        max-width: 380px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background: #fff;
        display: flex;
        flex-direction: column;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }
      .panel h3 {
        margin: 0;
        padding: 10px;
        border-bottom: 1px solid #eee;
        border-radius: 10px 10px 0 0;
        font-size: 16px;
        background: linear-gradient(to right, #4a90e2, #357ab8);
        color: white;
      }
      .info {
        font-size: 12px;
        padding: 6px 10px;
        background: #f9f9f9;
        border-bottom: 1px solid #eee;
      }
      .log {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.4;
      }
      .msg {
        margin: 6px 0;
      }
      .user {
        color: #222;
        font-weight: 500;
      }
      .ai {
        color: #0a7;
      }
      .sys {
        color: #c33;
        font-style: italic;
      }
      .typing {
        font-style: italic;
        color: #555;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
        100% {
          opacity: 1;
        }
      }
      form {
        display: flex;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid #eee;
        background: #fafafa;
      }
      input,
      button {
        font: inherit;
        padding: 6px 8px;
      }
      input {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        border: none;
        border-radius: 4px;
        background: #4a90e2;
        color: white;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #357ab8;
      }
      /* shared input */
      #main-form {
        margin-top: 16px;
        border-top: 2px solid #ddd;
        padding-top: 12px;
      }
    </style>
  </head>
  <body>
    <h2>vAgent Chat Stress Test — 4 Panels</h2>

    <div class="controls">
      <button id="randomize">🔄 Randomize Session & Run IDs</button>
    </div>

    <div class="container">
      <div class="panel" id="chat1">
        <h3>Panel 1</h3>
        <div class="info">
          Session: <span id="sid-1"></span> | Run: <span id="rid-1"></span>
        </div>
        <div class="log" id="log-1"></div>
        <form class="local-form" data-panel="1">
          <input placeholder="Chat with Panel 1…" />
          <button>Send</button>
        </form>
      </div>
      <div class="panel" id="chat2">
        <h3>Panel 2</h3>
        <div class="info">
          Session: <span id="sid-2"></span> | Run: <span id="rid-2"></span>
        </div>
        <div class="log" id="log-2"></div>
        <form class="local-form" data-panel="2">
          <input placeholder="Chat with Panel 2…" />
          <button>Send</button>
        </form>
      </div>
      <div class="panel" id="chat3">
        <h3>Panel 3</h3>
        <div class="info">
          Session: <span id="sid-3"></span> | Run: <span id="rid-3"></span>
        </div>
        <div class="log" id="log-3"></div>
        <form class="local-form" data-panel="3">
          <input placeholder="Chat with Panel 3…" />
          <button>Send</button>
        </form>
      </div>
      <div class="panel" id="chat4">
        <h3>Panel 4</h3>
        <div class="info">
          Session: <span id="sid-4"></span> | Run: <span id="rid-4"></span>
        </div>
        <div class="log" id="log-4"></div>
        <form class="local-form" data-panel="4">
          <input placeholder="Chat with Panel 4…" />
          <button>Send</button>
        </form>
      </div>
    </div>

    <form id="main-form">
      <input id="main-input" placeholder="Broadcast to all panels…" />
      <button>Send to All</button>
    </form>

    <script type="module">
      const API_BASE = "http://localhost:3000";
      const WORKFLOW_ID = "chat"; // all panels hit the same workflow
      const sessions = {};
      const runs = {};

      function uuid() {
        if (window.crypto?.randomUUID) return crypto.randomUUID();
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
          const r = (Math.random() * 16) | 0,
            v = c === "x" ? r : (r & 0x3) | 0x8;
          return v.toString(16);
        });
      }

      function randomizeAll() {
        for (let n = 1; n <= 4; n++) {
          sessions[n] = "session-" + uuid().slice(0, 8);
          runs[n] = "run-" + uuid().slice(0, 8);
          document.getElementById(`sid-${n}`).textContent = sessions[n];
          document.getElementById(`rid-${n}`).textContent = runs[n];
        }
      }

      function line(logId, cls, text) {
        const div = document.createElement("div");
        div.className = "msg " + cls;
        div.textContent = text;
        const logEl = document.getElementById(logId);
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
      }

      async function sendMessage(panel, message) {
        const logId = `log-${panel}`;
        const runId = (runs[panel] = uuid());
        document.getElementById(`rid-${panel}`).textContent = runId;

        line(logId, "user", "You: " + message);
        const typingId = "typing-" + panel;
        const typingEl = document.createElement("div");
        typingEl.className = "msg typing";
        typingEl.textContent = "AI is typing…";
        typingEl.id = typingId;
        document.getElementById(logId).appendChild(typingEl);

        try {
          const res = await fetch(`${API_BASE}/v1/runs/${WORKFLOW_ID}`, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              accept: "application/json",
            },
            body: JSON.stringify({
              runId,
              sessionId: sessions[panel],
              input: { message },
            }),
          });
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          document.getElementById(typingId)?.remove();
          line(logId, "ai", "AI: " + data.reply);
        } catch (err) {
          document.getElementById(typingId)?.remove();
          line(logId, "sys", "⚠️ " + (err?.message || err));
        }
      }

      async function sendAll(message) {
        await Promise.allSettled(
          [1, 2, 3, 4].map((n) => sendMessage(n, message))
        );
      }

      // broadcast form
      document.getElementById("main-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const msg = document.getElementById("main-input").value.trim();
        if (!msg) return;
        document.getElementById("main-input").value = "";
        sendAll(msg);
      });

      // local forms
      document.querySelectorAll(".local-form").forEach((form) => {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const panel = form.dataset.panel;
          const input = form.querySelector("input");
          const msg = input.value.trim();
          if (!msg) return;
          input.value = "";
          sendMessage(panel, msg);
        });
      });

      document
        .getElementById("randomize")
        .addEventListener("click", randomizeAll);

      // init
      randomizeAll();
    </script>
  </body>
</html>
